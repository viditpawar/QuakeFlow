name: quakeflow

# Settings shared by the Airflow services. Secrets (database password, keys) are not here: they are in
# secrets/airflow.env, which scripts/airflow_setup.py generates and git ignores.
x-airflow-common: &airflow-common
  image: quakeflow/airflow:3.3.2
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  profiles: ["orchestration"]
  env_file:
    - path: secrets/airflow.env
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # The Simple auth manager is meant for development. It is acceptable here only because Airflow is bound
    # to this machine and has one user. The password is generated, not a default (D-027).
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: quakeflow:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /run/airflow/passwords.json
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # What the DAGs hand on to the Spark containers they start. The same values as the spark service.
    POSTGRES_DB: ${POSTGRES_DB:-iceberg_catalog}
    POSTGRES_USER: ${POSTGRES_USER:-quakeflow}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quakeflow-local-password}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quakeflow}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-quakeflow-local-secret}
    WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
    PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: quakeflow-kafka
    profiles: ["core"]
    ports:
      - "127.0.0.1:9092:9092"   # this machine only: the listener has no authentication
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is for other containers, EXTERNAL is for tools running on the host.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Keep messages for 7 days so consumers can replay.
      KAFKA_LOG_RETENTION_HOURS: 168
      # Without this the broker writes to /tmp inside the container and the volume below stays empty,
      # so removing the container (docker compose down) would erase every topic.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # The USGS collector. Exactly one instance may run: its SQLite state has a single writer, and a
  # second collector would send every revision twice. Kafka is reached by service name, because
  # 127.0.0.1 inside this container would mean the container itself.
  collector:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    image: quakeflow/collector:0.1.0
    container_name: quakeflow-collector
    profiles: ["core"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:9108:9108"   # Prometheus metrics, this machine only
    volumes:
      - collector-state:/data
      # Reconciliation batches from Airflow (ingestion/outbox.py). The collector takes them over, because it
      # is the only writer of its state. Airflow's containers use the same volume through DockerOperator.
      - reconcile-outbox:/outbox
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    restart: unless-stopped

  # Stream processing. Start together with Kafka:
  #   docker compose --profile core --profile streaming up -d
  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/flink.Dockerfile
    image: quakeflow/flink:2.2.1
    container_name: quakeflow-flink-jobmanager
    profiles: ["streaming"]
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        state.backend.type: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./flink/sql:/opt/flink/sql:ro
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  flink-taskmanager:
    image: quakeflow/flink:2.2.1
    container_name: quakeflow-flink-taskmanager
    profiles: ["streaming"]
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 2
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        state.backend.type: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    mem_limit: 1792m
    restart: unless-stopped

  # Lakehouse. Start with: docker compose --profile batch up -d
  # Credentials default to local-only values; override them in .env. Ports are bound to
  # localhost so nothing is reachable from the network.
  postgres:
    image: postgres:17.11-alpine3.24
    container_name: quakeflow-postgres
    profiles: ["batch"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iceberg_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-quakeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quakeflow-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage holding the Iceberg data and metadata files.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: quakeflow-rustfs
    profiles: ["batch"]
    command: /data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-quakeflow}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-quakeflow-local-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    # Measured at 470 MB with the full pipeline loaded, so 512 MB left no headroom.
    mem_limit: 768m
    restart: unless-stopped

  # Spark runs per job instead of idling: docker compose --profile batch run --rm spark <command>
  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: quakeflow/spark:4.0.4
    profiles: ["batch"]
    scale: 0   # never started by "up": run it per job with "docker compose run --rm spark ..."
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iceberg_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-quakeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quakeflow-local-password}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quakeflow}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-quakeflow-local-secret}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
      # Kafka's internal listener. Start Kafka too (core profile) for jobs that read topics.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PYTHONPATH: /workspace
      # Set to http://pushgateway:9091 in .env to report job results to Prometheus. Empty means off.
      PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-}
    volumes:
      - ./iceberg/catalog:/opt/quakeflow/conf:ro
      - ./iceberg/sql:/workspace/iceberg/sql:ro
      - ./batch:/workspace/batch:ro
      - ./configs/quality.yaml:/workspace/configs/quality.yaml:ro
      - ./data/history:/data/history:ro   # windows written by batch/backfill.py
      - spark-checkpoints:/checkpoints
    mem_limit: 2g

  # Monitoring. Start with: docker compose --profile monitoring up -d
  # Prometheus is at http://localhost:9090 and Grafana at http://localhost:3000
  # (user admin, password from GRAFANA_ADMIN_PASSWORD, default quakeflow-local).
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: quakeflow-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.13
    container_name: quakeflow-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-quakeflow-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/quakeflow-operations.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    restart: unless-stopped

  # Spark jobs are one-off containers, so they push their results here when they finish.
  pushgateway:
    image: prom/pushgateway:v1.11.4
    container_name: quakeflow-pushgateway
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9091:9091"
    mem_limit: 64m
    restart: unless-stopped

  # Consumer group lag. Needs Kafka (core profile) to be running too.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: quakeflow-kafka-exporter
    profiles: ["monitoring"]
    command:
      - --kafka.server=kafka:19092
    mem_limit: 96m
    restart: unless-stopped

  # Orchestration with Apache Airflow. Needs PostgreSQL (batch profile) for its metadata:
  #   python scripts/airflow_setup.py        once, creates the secrets and its database
  #   docker compose --profile batch --profile orchestration up -d
  # The UI is at http://127.0.0.1:8080. Only the scheduler has the Docker socket, because it is the
  # component that runs the tasks that start the platform's containers. See D-027 for what that means.
  airflow-migrate:
    <<: *airflow-common
    container_name: quakeflow-airflow-migrate
    command: ["db", "migrate"]
    restart: "no"
    mem_limit: 768m

  airflow-apiserver:
    <<: *airflow-common
    container_name: quakeflow-airflow-apiserver
    command: ["api-server"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      # Only the API server reads the login, and the Simple auth manager rewrites the file at start-up,
      # so this mount cannot be read-only.
      - ./secrets/airflow_passwords.json:/run/airflow/passwords.json
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    mem_limit: 1536m

  airflow-scheduler:
    <<: *airflow-common
    container_name: quakeflow-airflow-scheduler
    command: ["scheduler"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock   # only here: this component starts the task containers
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    mem_limit: 1536m

  airflow-dag-processor:
    <<: *airflow-common
    container_name: quakeflow-airflow-dag-processor
    command: ["dag-processor"]
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    mem_limit: 1536m

volumes:
  kafka-data:
  collector-state:
  reconcile-outbox:
  flink-checkpoints:
  postgres-data:
  rustfs-data:
  spark-checkpoints:
  prometheus-data:
  grafana-data:
  airflow-logs:
