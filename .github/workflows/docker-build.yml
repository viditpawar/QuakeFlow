name: Docker images

# Builds the collector, Flink and Spark images. The last two download about a gigabyte of base layers and several
# jars. That is slow, so it runs only when something that affects the images changes, or on demand.
# Each download is verified against a pinned SHA-256, so a build also checks that those are still right.
on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "iceberg/catalog/**"
      - "iceberg/sql/**"
      - "batch/**"
      - "configs/quality.yaml"
      - "ingestion/**"
      - "schemas/**"
      - "processing/**"
      - "configs/sources.yaml"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "iceberg/catalog/**"
      - "iceberg/sql/**"
      - "batch/**"
      - "configs/quality.yaml"
      - "ingestion/**"
      - "schemas/**"
      - "processing/**"
      - "configs/sources.yaml"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker compose --profile core --profile streaming --profile batch build
      - name: Flink image has the Kafka connector
        run: docker run --rm --entrypoint sh quakeflow/flink:2.2.1 -c "ls /opt/flink/lib | grep flink-sql-connector-kafka"
      - name: Spark image has Iceberg, Kafka and the Python packages it needs
        run: |
          docker run --rm --entrypoint sh quakeflow/spark:4.0.4 -c "ls /opt/spark/jars | grep -E 'iceberg-spark-runtime|iceberg-aws-bundle|postgresql|spark-sql-kafka|kafka-clients'"
          docker run --rm --entrypoint python3 quakeflow/spark:4.0.4 -c "import yaml, prometheus_client; print('python packages ok')"
      - name: Collector image imports its code, and runs as an unprivileged user
        run: |
          docker run --rm --entrypoint python quakeflow/collector:0.1.0 -c "import confluent_kafka, pydantic, prometheus_client, yaml, requests, ingestion.live.poller; print('collector imports ok')"
          test "$(docker run --rm --entrypoint id quakeflow/collector:0.1.0 -u)" = "10001"
