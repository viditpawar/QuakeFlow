# Pull requests for newer dependencies. Everything is pinned (actions by commit, images and jars by
# version and checksum), so updates only happen when a pull request here is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
