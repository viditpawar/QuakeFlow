# Kafka topics for QuakeFlow. Single broker, so replication_factor must stay 1.
# Events are keyed by the USGS event_id so all versions of one earthquake land in one
# partition and keep their order.
topics:
  - name: quakeflow.events.raw
    purpose: Normalized earthquake observations from the USGS live poller
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000   # 7 days

  - name: quakeflow.events.validated
    purpose: Observations that passed validation, deduplication, and revision detection
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000

  - name: quakeflow.events.dlq
    purpose: Invalid or unprocessable records kept for investigation and replay
    partitions: 1
    replication_factor: 1
    retention_ms: 2592000000  # 30 days
