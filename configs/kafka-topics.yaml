# Kafka topics for StreamLake. Single broker, so replication_factor must stay 1.
# Status events are keyed by station_id so one station always lands in one partition.
topics:
  - name: citibike.station-status.raw
    purpose: Raw station observations from the GBFS poller
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000   # 7 days

  - name: citibike.station-status.validated
    purpose: Observations that passed validation and deduplication
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000

  - name: citibike.station-availability.metrics
    purpose: Aggregated station availability metrics from Flink
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000

  - name: citibike.station-status.dlq
    purpose: Invalid or unprocessable records kept for investigation and replay
    partitions: 1
    replication_factor: 1
    retention_ms: 2592000000  # 30 days
